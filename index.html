<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Option 1 - Industrial Pro</title>
    <style>
        :root { --bg: #f1f5f9; --card: #ffffff; --primary: #f97316; --dark: #0f172a; --text: #334155; }
        body { background: var(--bg); font-family: -apple-system, sans-serif; margin: 0; padding: 15px; padding-bottom: 80px; }
        .header { background: var(--dark); color: white; padding: 15px; border-radius: 12px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .card { background: var(--card); padding: 16px; border-radius: 12px; border-left: 5px solid var(--primary); box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 15px; }
        h2 { font-size: 1rem; color: var(--dark); margin-bottom: 10px; }
        .btn { background: var(--primary); color: white; border: none; padding: 14px; width: 100%; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; }
        .form-control { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; margin-bottom: 10px; box-sizing: border-box; }
        nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--dark); display: flex; justify-content: space-around; padding: 12px 0; }
        nav a { color: #94a3b8; text-decoration: none; font-size: 0.75rem; font-weight: bold; }
        nav a.active { color: var(--primary); }
    </style>
</head>
<body>
    <div class="header">
        <div><strong>🏗️ SmartSite</strong> Pro</div>
        <small style="background:#334155; padding:4px 8px; border-radius:6px;">Șef Echipă</small>
    </div>

    <div class="card">
        <h2>⏱️ Prezență Echipă (Pontaj)</h2>
        <select class="form-control"><option>Ion Popescu</option><option>Vasile Ionescu</option></select>
        <select class="form-control"><option>🟢 Check-IN (Intrare)</option><option>🔴 Check-OUT (Ieșire)</option></select>
        <button class="btn">Înregistrează Pontaj</button>
    </div>

    <nav>
        <a href="#" class="active">Pontaj</a>
        <a href="#">Jurnal Șantier</a>
        <a href="#">Scule</a>
        <a href="#">Utilaje</a>
    </nav>
</body>
</html>
